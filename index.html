<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏夹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .category {
            margin-bottom: 40px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .category-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e3c72;
            border-left: 5px solid #1e3c72;
            padding-left: 15px;
            margin-bottom: 20px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .card {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s ease;
            border: 1px solid #e9ecef;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            background: #ffffff;
        }
        .card a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: 500;
            font-size: 1.1rem;
            display: block;
            word-break: break-all;
        }
        .card a:hover {
            color: #1e3c72;
        }
        .url {
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-top: 8px;
            word-break: break-all;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
        }
        @media (max-width: 600px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
            body {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 我的网站收藏夹</h1>
        <div id="content" class="loading">加载中...</div>
    </div>

    <script>
        // 读取 data.json 文件并渲染页面
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error('数据文件加载失败');
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('content');
                container.innerHTML = '';
                
                // 获取所有分类并排序
                const categories = Object.keys(data).sort();
                
                for (const category of categories) {
                    const links = data[category];
                    if (!links || links.length === 0) continue;
                    
                    // 创建分类区块
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'category';
                    categoryDiv.innerHTML = `
                        <div class="category-title">📁 ${category}</div>
                        <div class="card-grid" id="grid-${category.replace(/\s/g, '')}"></div>
                    `;
                    container.appendChild(categoryDiv);
                    
                    const grid = categoryDiv.querySelector(`.card-grid`);
                    
                    // 添加每个链接卡片
                    links.forEach(link => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <a href="${link.url}" target="_blank" rel="noopener noreferrer">🔗 ${link.name}</a>
                            <div class="url">${link.url}</div>
                        `;
                        grid.appendChild(card);
                    });
                }
                
                if (container.innerHTML === '') {
                    container.innerHTML = '<div class="loading">暂无数据，请添加你的网站链接</div>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('content').innerHTML = '<div class="loading">❌ 加载失败，请确保 data.json 文件存在</div>';
            });
    </script>
</body>
</html>
