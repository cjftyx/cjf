<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>网站管理后台</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
        input, select, button { margin: 10px 0; padding: 8px; width: 100%; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>网站链接管理后台</h1>
    <div id="status"></div>

    <h2>添加链接</h2>
    <input type="text" id="addCategory" placeholder="分类名称 (如: 工具类)">
    <input type="text" id="addName" placeholder="网站名称">
    <input type="text" id="addUrl" placeholder="网址">
    <button onclick="addLink()">添加链接</button>

    <h2>删除链接</h2>
    <input type="text" id="delCategory" placeholder="分类名称">
    <input type="text" id="delName" placeholder="网站名称">
    <button onclick="deleteLink()">删除链接</button>

    <h2>查看当前数据</h2>
    <button onclick="viewData()">刷新数据</button>
    <pre id="dataView"></pre>

    <script>
        // === 请修改以下两个变量为你的实际信息 ===
        const REPO_OWNER = 'cjftyx';        // 你的GitHub用户名
        const REPO_NAME = 'cjf';                 // 你的仓库名
        // =======================================

        // 辅助函数：将字符串进行 UTF-8 编码后转为 Base64（支持中文）
        function b64EncodeUnicode(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                return String.fromCharCode('0x' + p1);
            }));
        }

        // 辅助函数：将 Base64 解码为 UTF-8 字符串（支持中文）
        function b64DecodeUnicode(str) {
            return decodeURIComponent(atob(str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }

        // 获取 GitHub Token（每次运行时输入，不保存在代码中）
        let GITHUB_TOKEN = localStorage.getItem('github_token');
        if (!GITHUB_TOKEN) {
            GITHUB_TOKEN = prompt('请输入你的 GitHub Personal Access Token：');
            if (GITHUB_TOKEN) {
                localStorage.setItem('github_token', GITHUB_TOKEN);
            } else {
                alert('必须输入 Token 才能使用管理功能');
            }
        }

        const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data.json`;
        const MANAGE_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/manage.json`;

        async function updateData(newCommands) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '正在更新...';
            try {
                // 1. 获取 manage.json 的当前内容和 SHA
                const manageResp = await fetch(MANAGE_URL, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (!manageResp.ok) throw new Error('获取 manage.json 失败');
                const manageData = await manageResp.json();
                let manage;
                try {
                    const decoded = b64DecodeUnicode(manageData.content);
                    manage = JSON.parse(decoded);
                } catch(e) {
                    manage = { commands: [] };
                }
                if (!manage.commands) manage.commands = [];

                // 2. 添加新指令
                manage.commands.push(...newCommands);
                const newManageContent = b64EncodeUnicode(JSON.stringify(manage, null, 2));

                // 3. 更新 manage.json
                const updateResp = await fetch(MANAGE_URL, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: '通过管理后台更新数据',
                        content: newManageContent,
                        sha: manageData.sha
                    })
                });
                if (!updateResp.ok) throw new Error('更新 manage.json 失败');
                
                statusDiv.innerHTML = '<span class="success">✓ 指令已提交，网站将在30秒内自动更新</span>';
                setTimeout(() => viewData(), 2000);
            } catch (err) {
                statusDiv.innerHTML = `<span class="error">错误: ${err.message}</span>`;
            }
        }

        function addLink() {
            const category = document.getElementById('addCategory').value.trim();
            const name = document.getElementById('addName').value.trim();
            const url = document.getElementById('addUrl').value.trim();
            if (!category || !name || !url) {
                alert('请填写完整信息');
                return;
            }
            updateData([{ action: 'add', category, name, url }]);
            document.getElementById('addCategory').value = '';
            document.getElementById('addName').value = '';
            document.getElementById('addUrl').value = '';
        }

        function deleteLink() {
            const category = document.getElementById('delCategory').value.trim();
            const name = document.getElementById('delName').value.trim();
            if (!category || !name) {
                alert('请填写分类和网站名称');
                return;
            }
            updateData([{ action: 'delete', category, name }]);
            document.getElementById('delCategory').value = '';
            document.getElementById('delName').value = '';
        }

        async function viewData() {
            try {
                const resp = await fetch(API_URL, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
                });
                if (!resp.ok) throw new Error('获取 data.json 失败');
                const fileData = await resp.json();
                const decoded = b64DecodeUnicode(fileData.content);
                const content = JSON.parse(decoded);
                document.getElementById('dataView').textContent = JSON.stringify(content, null, 2);
            } catch (err) {
                document.getElementById('dataView').textContent = '加载失败: ' + err.message;
            }
        }
        viewData();
    </script>
</body>
</html>
