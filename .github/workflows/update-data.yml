name: Update Website Data

on:
  push:
    branches: [ "main" ]
    paths:
      - 'manage.json'

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run update script
        run: node .github/workflows/update-script.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update data.json via GitHub Actions"
          git push
